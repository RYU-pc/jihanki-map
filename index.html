<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="自販機マップ">
<meta name="robots" content="noindex,nofollow">
<title>自販機マップ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231D4ED8'/%3E%3Crect x='6' y='3.5' width='12' height='17' rx='2' fill='white'/%3E%3Crect x='8' y='6' width='8' height='6' rx='1' fill='%231D4ED8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<style>
/* Layout: header / map-or-list stage / floating tab bar. Register wizard, detail and settings open as full sheets.
   Signature detail: prices are shown as dot-matrix LED chips on a dark panel, like the real button panel. */
:root{
  color-scheme:light;
  --bg:#EBEFF3; --surface:#FFFFFF; --surface2:#E2E8EE; --ink:#0F1B27; --muted:#55687A; --line:#D0D8E0;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#DCE6FB;
  --panel:#0D1621; --panel-ink:#9FB2C5; --led:#FF5C39;
  --cold:#2F6FE0; --hot:#E4572E;
  --ok:#0E8A5F; --warn:#9A6200; --danger:#C0301F; --danger-soft:#FBE3DF;
  --map-bg:#E6ECF1; --pin:#1D4ED8; --pin-dim:#8494A5; --pin-win:#FFFFFF;
  --shadow:0 6px 20px rgba(15,27,39,.16);
  --font-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',Meiryo,sans-serif;
  --font-led:'DotGothic16','Hiragino Sans','Yu Gothic',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1017; --surface:#131C26; --surface2:#1B2733; --ink:#E6EDF4; --muted:#92A4B5; --line:#243241;
    --accent:#7AA2FF; --accent-ink:#0A1017; --accent-soft:#1B2B4B;
    --panel:#05090E; --panel-ink:#8FA3B8; --led:#FF7152;
    --cold:#6BA0FF; --hot:#FF8157;
    --ok:#46C592; --warn:#E3B04B; --danger:#FF8A78; --danger-soft:#3A1D19;
    --map-bg:#0F1821; --pin:#7AA2FF; --pin-dim:#52657A; --pin-win:#0A1017;
    --shadow:0 6px 20px rgba(0,0,0,.55);
  }
  :root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1017; --surface:#131C26; --surface2:#1B2733; --ink:#E6EDF4; --muted:#92A4B5; --line:#243241;
  --accent:#7AA2FF; --accent-ink:#0A1017; --accent-soft:#1B2B4B;
  --panel:#05090E; --panel-ink:#8FA3B8; --led:#FF7152;
  --cold:#6BA0FF; --hot:#FF8157;
  --ok:#46C592; --warn:#E3B04B; --danger:#FF8A78; --danger-soft:#3A1D19;
  --map-bg:#0F1821; --pin:#7AA2FF; --pin-dim:#52657A; --pin-win:#0A1017;
  --shadow:0 6px 20px rgba(0,0,0,.55);
}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
.is-photo .leaflet-tile-pane{filter:none !important}
*{box-sizing:border-box}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.ic{width:22px;height:22px;flex:none}

#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand svg{width:30px;height:30px;color:var(--accent);flex:none}
.brand h1{font-size:22px;font-weight:900;letter-spacing:.04em;white-space:nowrap}
.stat{font-family:var(--font-led);background:var(--panel);color:var(--led);padding:4px 12px 3px;border-radius:8px;font-size:14px;letter-spacing:.05em;white-space:nowrap;text-shadow:0 0 6px color-mix(in srgb,var(--led) 50%,transparent)}
.stat b{font-weight:400;font-size:17px}
.banner{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:6px 12px}
.stage{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0}

/* map */
.mapbox{position:absolute;inset:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--map-bg)}
#map{position:absolute;inset:0;z-index:0;background:var(--map-bg);font-family:var(--font-body)}
.mapfail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.leaflet-control-attribution{font-size:10px!important}
.map-search{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:8px;z-index:500}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.search .in{padding-left:40px;box-shadow:var(--shadow)}
.round{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.round svg{width:22px;height:22px}
.map-ctrl{position:absolute;right:10px;top:66px;display:grid;gap:8px;z-index:500}
.hitcount{position:absolute;left:12px;top:64px;z-index:500;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 12px;box-shadow:var(--shadow)}
.mapempty{position:absolute;left:16px;right:16px;bottom:34px;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);text-align:center;display:grid;gap:10px;justify-items:center}
.mapempty h2{font-size:18px;font-weight:900}
.mapempty p{color:var(--muted);font-size:13.5px}
.pin-sheet{position:absolute;left:0;right:0;bottom:0;z-index:600;padding:10px}
.pc-scroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:2px}
.pcard{flex:0 0 min(88%,350px);scroll-snap-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px;display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px}
.pcard:only-child{flex-basis:100%}
.pcard .thumb{width:78px;height:78px}
.pcard h3{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.pinicon{background:none;border:0}
.pinicon svg{width:28px;height:38px;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));transform-origin:50% 100%;transition:transform .15s}
.pinicon .b{fill:var(--pin)}
.pinicon .w{fill:var(--pin-win)}
.pinicon.sel svg{transform:scale(1.3)}
.clus{background:none;border:0}
.clus span{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--panel);color:var(--led);border:2px solid var(--led);font-family:var(--font-led);font-size:16px;box-shadow:var(--shadow)}
.me-dot{background:none;border:0}
.me-dot i{display:block;width:16px;height:16px;border-radius:50%;background:#2F7BFF;border:3px solid #fff;box-shadow:0 0 0 2px rgba(47,123,255,.35),var(--shadow)}

/* list */
.listwrap{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;padding-bottom:4px}
.filters{display:grid;gap:8px}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.frow .in{min-height:40px;padding:6px 10px;font-size:14px}
.cards{display:grid;gap:10px}
.card{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.thumb{width:84px;height:84px;border-radius:12px;background:var(--surface2);overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
img.bad{visibility:hidden}
.cbody{min-width:0;display:grid;gap:4px;align-content:start}
.cbody h3{font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12.5px;color:var(--muted)}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.dchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;background:var(--surface2);border-radius:8px;padding:2px 4px 2px 8px;font-size:12.5px}
.dchip.hl{background:var(--accent-soft)}
.dchip .dn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9em}
.more{font-size:12.5px;color:var(--muted);align-self:center}
.led{font-family:var(--font-led);background:var(--panel);color:var(--led);border-radius:6px;padding:2px 7px 1px;font-size:13px;letter-spacing:.06em;line-height:1.5;white-space:nowrap;text-shadow:0 0 6px color-mix(in srgb,var(--led) 50%,transparent);font-variant-numeric:tabular-nums}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;display:grid;gap:12px;justify-items:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:17px;font-weight:900}

/* tab bar */
.tabs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--panel);border-radius:22px;padding:8px 10px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;border:0;background:transparent;color:var(--panel-ink);font-size:12px;font-weight:700;border-radius:14px}
.tab[aria-current="page"]{color:var(--led)}
.tab.reg{flex-direction:row;gap:8px;background:var(--accent);color:var(--accent-ink);padding:0 24px;font-size:15px;font-weight:900;letter-spacing:.06em}

/* buttons / fields */
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;text-decoration:none}
.btn{white-space:nowrap;flex:none}
.sh-foot .btn,.ai-bar .btn{flex:1 1 auto}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.danger.sure{background:var(--danger);color:#fff}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);flex:none}
.in{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px}
textarea.in{min-height:84px;resize:vertical}
label.fld{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
label.fld .in{font-weight:400;color:var(--ink)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:2000;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:720px;margin:0 auto;height:100%;display:flex;flex-direction:column;min-height:0}
.sh-top{display:flex;align-items:center;gap:6px;padding-block:8px}
.sh-top h2{flex:1;font-size:18px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-step{font-family:var(--font-led);color:var(--muted);font-size:14px}
.sh-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.sh-body>*{flex:none;min-width:0}
.sh-foot{display:flex;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.sh-foot .btn{flex:1}
.sh-foot .btn.primary{flex:2}
.stepper{list-style:none;margin:0 0 8px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stepper li{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);border-top:3px solid var(--line);padding-top:6px}
.stepper li span{font-family:var(--font-led);font-size:13px}
.stepper li.cur{color:var(--ink);border-color:var(--accent)}
.stepper li.done{color:var(--ok);border-color:var(--ok)}
.lead{color:var(--muted);font-size:14px}
.pickrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pick{display:grid;gap:4px;justify-items:center;text-align:center;padding:22px 10px;border-radius:18px;border:1.5px dashed var(--line);background:var(--surface);cursor:pointer}
.pick svg{width:34px;height:34px;color:var(--accent)}
.pick b{font-size:16px}
.pick small{color:var(--muted);font-size:12px}
.pick.primary{background:var(--accent);border:1.5px solid var(--accent);color:var(--accent-ink)}
.pick.primary svg,.pick.primary small{color:var(--accent-ink)}
.prev{display:grid;gap:8px}
.prev img{width:100%;max-height:46vh;object-fit:contain;border-radius:14px;background:var(--surface2)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;border-radius:999px;padding:3px 10px;background:var(--surface2);display:inline-flex;align-items:center;gap:6px}
.tag svg{width:16px;height:16px}
.tag.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok);font-weight:700}
.tag.no{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.panel h3{font-size:14px;font-weight:900}
.msg{font-size:13px}
.msg.ok{color:var(--ok)}
.msg.err{color:var(--danger)}
.note{font-size:12.5px;color:var(--muted)}
.warnbox{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border-radius:12px;padding:10px 12px;font-size:13px}
.confirm{background:var(--danger-soft);border-radius:12px;padding:10px 12px;display:grid;gap:8px;font-size:13.5px}
.confirm div{display:flex;gap:8px}
.sum{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.sum .thumb{width:96px;height:96px}
.det-photo{background:var(--surface2);border-radius:16px;min-height:120px}
.det-photo img{display:block;width:100%;max-height:52vh;object-fit:contain;margin:0 auto;border-radius:16px}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px}
.coord{font-family:var(--font-led);font-size:16px}

/* location picker */
.lp{display:grid;gap:10px}
.lp-map{height:min(46vh,340px);min-height:220px;border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;z-index:0;background:var(--map-bg)}
.lp-search{display:flex;gap:8px}
.lp-results{display:grid;gap:6px}
.lp-results button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:13px}

/* drinks editor */
.ai-bar{display:flex;flex-wrap:wrap;gap:8px}
.ai-bar .btn{flex:1 1 150px}
.status{display:flex;align-items:center;gap:10px;font-size:13.5px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.slot{display:grid;gap:3px;align-content:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px;min-width:0}
.slot.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.slot-top{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.td{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.td-cold{background:var(--cold)}
.td-hot{background:var(--hot)}
.ai-tag{margin-left:auto;font-family:var(--font-led);font-size:10.5px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 4px}
.slot-name{font-size:13px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;overflow-wrap:anywhere}
.slot-maker{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:1.5em}
.slot .led{text-align:center;margin-top:2px}
.slot.add{place-items:center;align-content:center;min-height:116px;border-style:dashed;color:var(--accent);font-weight:700;font-size:13px;text-align:center}
.slot.add svg{width:26px;height:26px}
.ed{background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:14px;display:grid;gap:10px}
.ed-h{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* cropper */
.cropper{position:fixed;inset:0;z-index:3000;background:#05090E;color:#E6EDF4;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px;font-weight:700}
.cr-top .btn{background:transparent;color:#E6EDF4;border-color:#34475A}
.cr-stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.cr-wrap{position:relative;line-height:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.cr-wrap img{max-width:100%;max-height:calc(100vh - 200px);max-height:calc(100dvh - 200px);display:block;-webkit-user-drag:none;pointer-events:none}
.cr-box{position:absolute;border:2px solid #FF7152;border-radius:4px;box-shadow:0 0 0 9999px rgba(5,9,14,.62);pointer-events:none}
.cr-bottom{display:flex;gap:10px;padding-block:10px}
.cr-bottom .btn{flex:1}
.cr-bottom .btn:not(.primary){background:transparent;color:#E6EDF4;border-color:#34475A}
.cr-help{text-align:center;font-size:13px;color:#9FB2C5;padding-bottom:6px}


/* drink photos / lookup */
.slot-img{display:grid;place-items:center;height:76px;border-radius:8px;background:var(--surface2);overflow:hidden;color:var(--muted)}
.slot-img img{width:100%;height:100%;object-fit:contain;display:block}
.ph{width:30px;height:30px;opacity:.55}
.ai-tag.ok{background:color-mix(in srgb,var(--ok) 22%,var(--surface));color:var(--ok)}
.dimg{width:24px;height:24px;object-fit:contain;border-radius:5px;background:var(--surface);flex:none}
.dchip:has(.dimg){padding-left:3px}
.ed-photo{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:start}
.dphoto{width:104px;height:104px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;color:var(--muted)}

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtD=ms=>ms?new Date(ms).toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric'}):'';
const fmtDT=ms=>ms?new Date(ms).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const hasLoc=m=>typeof m.lat==='number'&&typeof m.lng==='number';
const priceTxt=p=>typeof p==='number'?'¥'+p:'¥---';
const coordTxt=(a,b)=>a.toFixed(5)+', '+b.toFixed(5);
const gmaps=(a,b)=>'https://www.google.com/maps/search/?api=1&query='+a+','+b;
const osm=(a,b)=>'https://www.openstreetmap.org/?mlat='+a+'&mlon='+b+'#map=18/'+a+'/'+b;
function hav(a,b,c,d){const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const distTxt=m=>{if(!state.me||!hasLoc(m))return '';const d=hav(state.me.lat,state.me.lng,m.lat,m.lng);return d<1000?Math.round(d/10)*10+'m':(d/1000).toFixed(1)+'km';};
const svg=p=>'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const I={
  camera:svg('<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
  image:svg('<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M5 18l5-5 4 4 2-2 3 3"/>'),
  plus:svg('<path d="M12 5v14M5 12h14"/>'),
  close:svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  back:svg('<path d="M15 6l-6 6 6 6"/>'),
  spark:svg('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>'),
  crop:svg('<path d="M7 3v14h14"/><path d="M3 7h14v14"/>'),
  ext:svg('<path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/>'),
  map:svg('<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>'),
  check:svg('<path d="M5 12.5l4.5 4.5L19 7"/>'),
  globe:svg('<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.6 3.6 5.4 3.6 8.5s-1 5.9-3.6 8.5c-2.6-2.6-3.6-5.4-3.6-8.5s1-5.9 3.6-8.5z"/>'),
  target:svg('<circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>')
};
const TYPES=['缶','ペット','瓶','紙パック','カップ','その他'];
const PROVIDERS={
  gemini:{name:'Google Gemini（無料枠あり）',keyUrl:'https://aistudio.google.com/apikey',ph:'AIza...',models:[['gemini-3.5-flash-lite','3.5 Flash-Lite（標準・軽い）'],['gemini-3.6-flash','3.6 Flash（高精度）'],['gemini-2.5-flash','2.5 Flash（旧型）']]},
  claude:{name:'Anthropic Claude（有料）',keyUrl:'https://console.anthropic.com/settings/keys',ph:'sk-ant-...',models:[['claude-sonnet-5-5','Sonnet 5.5（標準）'],['claude-haiku-5-5','Haiku 5.5（速い・安い）'],['claude-opus-5-5','Opus 5.5（高精度）']]}
};
const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
const provider=()=>{const v=ls.get('jm-provider');return PROVIDERS[v]?v:'gemini';};
const apiKey=()=>(ls.get('jm-key-'+provider())||(provider()==='claude'?ls.get('jm-key'):'')||'').trim();
const apiModel=()=>{const p=provider(),m=ls.get('jm-model-'+p);return PROVIDERS[p].models.some(x=>x[0]===m)?m:PROVIDERS[p].models[0][0];};

/* ---------------- state ---------------- */
const state={machines:[],loaded:false,persist:true,tab:'map',sel:[],openId:null,res:[],fitted:false,me:null,baseIdx:0,
  f:{q:'',type:'',temp:'',max:0,sort:'new',located:false}};
const getM=id=>state.machines.find(m=>m.id===id);
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3400);}

/* ---------------- storage: IndexedDB (data never leaves this browser) ---------------- */
const DB_NAME='jihanki-map',STORE='machines';
let idb=null;
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{r.result.createObjectStore(STORE,{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const store=mode=>idb.transaction(STORE,mode).objectStore(STORE);
const rec=m=>{const o={};for(const k of Object.keys(m))if(k[0]!=='_')o[k]=m[k];return o;};
const idbAll=()=>rq(store('readonly').getAll());
const idbPut=m=>rq(store('readwrite').put(rec(m)));
const idbDel=id=>rq(store('readwrite').delete(id));
function hydrate(m){
  if(!Array.isArray(m.drinks))m.drinks=[];
  if(m.thumbBlob&&!m._thumb)m._thumb=URL.createObjectURL(m.thumbBlob);
  return m;
}
function photoURL(m){if(!m._photo&&m.photoBlob)m._photo=URL.createObjectURL(m.photoBlob);return m._photo||'';}
function imgSrc(m,kind){return kind==='thumb'?(m._thumb||photoURL(m)):photoURL(m);}
const imgTag=(m,kind)=>{const s=imgSrc(m,kind);return s?'<img src="'+esc(s)+'" alt="" loading="lazy">':'';};
document.addEventListener('error',e=>{if(e.target&&e.target.tagName==='IMG')e.target.classList.add('bad');},true);
const timers=new Map();
function saveSoon(id,delay=500){
  clearTimeout(timers.get(id));
  timers.set(id,setTimeout(async()=>{timers.delete(id);const m=getM(id);if(!m||!state.persist)return;try{await idbPut(m);}catch(e){toast('保存できませんでした。');}},delay));
}
function touch(id){const m=getM(id);if(!m)return;m.updatedAt=Date.now();saveSoon(id);}
async function insertMachine(m){
  if(state.persist)await idbPut(m);
  hydrate(m);state.machines.push(m);
}
async function deleteMachine(id){
  const m=getM(id);if(!m)return;
  try{
    if(state.persist)await idbDel(id);
    [m._thumb,m._photo].forEach(u=>{if(u)URL.revokeObjectURL(u);});
    state.machines=state.machines.filter(x=>x.id!==id);
    state.sel=state.sel.filter(x=>x!==id);
    closeDetail();refreshAll();toast('削除しました');
  }catch(e){toast('削除できませんでした。');}
}

/* ---------------- images / EXIF / location parsing ---------------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('load'));i.src=src;});}
function canvasBlob(c,q){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q));}
function scaleCanvas(img,max,sx,sy,sw,sh){
  sx=sx||0;sy=sy||0;sw=sw||img.naturalWidth;sh=sh||img.naturalHeight;
  const r=Math.min(1,max/Math.max(sw,sh));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*r));c.height=Math.max(1,Math.round(sh*r));
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  return c;
}
const imgBlob=(img,max,q,sx,sy,sw,sh)=>canvasBlob(scaleCanvas(img,max,sx,sy,sw,sh),q);
const blobToDataURL=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b);});
const blobToB64=async b=>{const u=await blobToDataURL(b);return u.slice(u.indexOf(',')+1);};
function parseExif(buf){
  try{
    const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return {};
    let o=2;
    while(o+4<v.byteLength){
      const mk=v.getUint16(o),len=v.getUint16(o+2);
      if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966)return readTiff(v,o+10);
      if((mk&0xFF00)!==0xFF00)break;
      o+=2+len;
    }
  }catch(e){}
  return {};
}
function readTiff(v,b){
  const le=v.getUint16(b)===0x4949;
  const g16=o=>v.getUint16(b+o,le),g32=o=>v.getUint32(b+o,le);
  const SZ={1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8};
  const ifd=o=>{const n=g16(o),r={};for(let i=0;i<n;i++){const e=o+2+i*12,t=g16(e),ty=g16(e+2),c=g32(e+4),size=(SZ[ty]||1)*c;r[t]={ty,c,o:size<=4?e+8:g32(e+8)};}return r;};
  const rat=o=>{const d=g32(o+4);return d?g32(o)/d:0;};
  const asc=t=>{let s='';for(let i=0;i<t.c-1;i++)s+=String.fromCharCode(v.getUint8(b+t.o+i));return s;};
  const out={};
  const i0=ifd(g32(4));
  if(i0[0x8769]){
    const ex=ifd(g32(i0[0x8769].o));
    if(ex[0x9003]){const m=asc(ex[0x9003]).match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);if(m)out.shotAt=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime();}
  }
  if(i0[0x8825]){
    const gp=ifd(g32(i0[0x8825].o));
    if(gp[1]&&gp[2]&&gp[3]&&gp[4]){
      const dms=t=>rat(t.o)+rat(t.o+8)/60+rat(t.o+16)/3600;
      let lat=dms(gp[2]),lng=dms(gp[4]);
      if(asc(gp[1])==='S')lat=-lat;
      if(asc(gp[3])==='W')lng=-lng;
      if(isFinite(lat)&&isFinite(lng)&&(lat||lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180){out.lat=lat;out.lng=lng;}
    }
  }
  return out;
}
function parseLoc(s){
  s=String(s||'').trim();
  if(!s)return {err:'座標かURLを貼り付けてください。'};
  if(/goo\.gl|maps\.app/i.test(s))return {err:'短縮URLからは座標を読み取れません。Googleマップで地点を長押しして出る座標（例 35.6812, 139.7671）をコピーして貼り付けてください。'};
  s=s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[．]/g,'.').replace(/[，、]/g,',').replace(/[－−]/g,'-');
  const pats=[/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/@(-?\d+\.\d+),(-?\d+\.\d+)/,/[?&](?:q|query|ll|center|destination)=(-?\d+(?:\.\d+)?)(?:,|%2C)\s*(-?\d+(?:\.\d+)?)/i,/mlat=(-?\d+\.\d+)&mlon=(-?\d+\.\d+)/,/map=\d+\/(-?\d+\.\d+)\/(-?\d+\.\d+)/,/(-?\d{1,3}(?:\.\d+)?)\s*[,\s]\s*(-?\d{1,3}(?:\.\d+)?)/];
  for(const p of pats){
    const m=s.match(p);
    if(m){const lat=+m[1],lng=+m[2];if(Math.abs(lat)<=90&&Math.abs(lng)<=180)return {lat,lng};}
  }
  return {err:'座標を読み取れませんでした。「35.6812, 139.7671」のように、緯度と経度を , で区切って入力してください。'};
}
function getPos(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej(new Error('この端末では位置情報を使えません。'));
    if(window.isSecureContext===false)return rej(new Error('位置情報は https のページでのみ使えます。公開して https で開いてください。'));
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
      e=>rej(new Error(e.code===1?'位置情報の利用が許可されていません。ブラウザの設定で許可してください。':'現在地を取得できませんでした。屋外でもう一度お試しください。')),
      {enableHighAccuracy:true,timeout:12000,maximumAge:15000});
  });
}

/* ---------------- search / filter ---------------- */
function isFilterActive(){const f=state.f;return !!(norm(f.q).trim()||f.type||f.temp||f.max||f.located);}
function minPrice(ds){const p=ds.map(d=>d.price).filter(x=>typeof x==='number');return p.length?Math.min(...p):null;}
function matchAll(){
  const f=state.f,toks=norm(f.q).split(/\s+/).filter(Boolean),df=!!(f.type||f.temp||f.max),out=[];
  for(const m of state.machines){
    if(f.located&&!hasLoc(m))continue;
    if(!toks.length&&!df){out.push({m,hits:[]});continue;}
    const place=norm((m.placeNote||'')+' '+(m.memo||''));
    const hits=[];
    for(const d of (m.drinks||[])){
      if(f.type&&d.type!==f.type)continue;
      if(f.temp&&d.temp!==f.temp)continue;
      if(f.max&&!(typeof d.price==='number'&&d.price<=f.max))continue;
      const t=norm((d.name||'')+' '+(d.maker||'')+' '+(d.size||'')+' '+(d.type||''))+' '+place;
      if(toks.every(k=>t.includes(k)))hits.push(d);
    }
    if(hits.length||(!df&&toks.length&&toks.every(k=>place.includes(k))))out.push({m,hits});
  }
  const mp=r=>{const p=minPrice(r.hits.length?r.hits:(r.m.drinks||[]));return p===null?1e9:p;};
  if(f.sort==='cheap')out.sort((a,b)=>mp(a)-mp(b));
  else if(f.sort==='count')out.sort((a,b)=>(b.m.drinks||[]).length-(a.m.drinks||[]).length);
  else if(f.sort==='near'&&state.me){const dd=r=>hasLoc(r.m)?hav(state.me.lat,state.me.lng,r.m.lat,r.m.lng):1e12;out.sort((a,b)=>dd(a)-dd(b));}
  else out.sort((a,b)=>(b.m.createdAt||0)-(a.m.createdAt||0));
  return out;
}

const MAP={map:null,cluster:null,dim:null,markers:new Map(),base:null,me:null};

const BASES=[

];
const baseIdxFromLS=()=>{const id=ls.get('jm-base2');const i=BASES.findIndex(b=>b.id===id);return i>=0?i:0;};
const makeBase=i=>L.tileLayer(BASES[i].url,BASES[i].o);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const PIN_SVG='<svg viewBox="0 0 20 34" aria-hidden="true"><path class="b" d="M4 0h12a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4h-3.5L10 34l-2.5-4H4a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4z"/><rect class="w" x="3.5" y="4" width="13" height="13" rx="2"/><rect class="b" x="5.5" y="7" width="2.4" height="7"/><rect class="b" x="8.8" y="7" width="2.4" height="7"/><rect class="b" x="12.1" y="7" width="2.4" height="7"/><rect class="w" x="3.5" y="20" width="6" height="3"/><circle class="w" cx="14.5" cy="21.5" r="1.6"/></svg>';
const pinIcon=sel=>L.divIcon({className:'pinicon'+(sel?' sel':''),html:PIN_SVG,iconSize:[28,38],iconAnchor:[14,38]});
function mapInit(){

}
function setBase(i,say){
  if(!MAP.map)return;
  if(MAP.base)MAP.map.removeLayer(MAP.base);
  MAP.base=makeBase(i).addTo(MAP.map);MAP.base.bringToBack();
  state.baseIdx=i;ls.set('jm-base2',BASES[i].id);

function mapRender(){
  if(!MAP.map)return;
  MAP.cluster.clearLayers();MAP.dim.clearLayers();MAP.markers.clear();
  const act=isFilterActive(),hit=new Set(state.res.map(r=>r.m.id)),sel=new Set(state.sel),ms=[];
  for(const m of state.machines){
    if(!hasLoc(m))continue;
    if(act&&!hit.has(m.id)){L.circleMarker([m.lat,m.lng],{radius:5,weight:1,color:'#fff',fillColor:css('--pin-dim'),fillOpacity:.75,interactive:false}).addTo(MAP.dim);continue;}
    const mk=L.marker([m.lat,m.lng],{icon:pinIcon(sel.has(m.id)),keyboard:false,riseOnHover:true,title:m.placeNote||''});
    mk.on('click',()=>setSel([m.id]));
    MAP.markers.set(m.id,mk);ms.push(mk);
  }
  MAP.cluster.addLayers(ms);
}
function setSel(ids){
  const prev=state.sel;state.sel=ids;
  prev.forEach(id=>{const k=MAP.markers.get(id);if(k)k.setIcon(pinIcon(false));});
  ids.forEach(id=>{const k=MAP.markers.get(id);if(k)k.setIcon(pinIcon(true));});
  renderPinSheet();
}
function fitAll(animate){
  if(!MAP.map)return;
  const pts=state.machines.filter(hasLoc).map(m=>[m.lat,m.lng]);
  if(!pts.length){if(state.me)MAP.map.setView([state.me.lat,state.me.lng],15,{animate});return;}
  if(pts.length===1){MAP.map.setView(pts[0],16,{animate});return;}
  MAP.map.fitBounds(L.latLngBounds(pts),{padding:[60,60],maxZoom:17,animate});
}
function showMe(){
  if(!MAP.map||!state.me)return;
  if(MAP.me)MAP.me.remove();
  const ll=[state.me.lat,state.me.lng];
  MAP.me=L.layerGroup([L.circle(ll,{radius:state.me.acc||30,weight:1,color:'#2F7BFF',fillColor:'#2F7BFF',fillOpacity:.1,interactive:false}),L.marker(ll,{icon:L.divIcon({className:'me-dot',html:'<i></i>',iconSize:[16,16]}),interactive:false,keyboard:false})]).addTo(MAP.map);
}
async function locateMe(move){
  try{
    const p=await getPos();state.me=p;showMe();
    if(move&&MAP.map)MAP.map.setView([p.lat,p.lng],Math.max(MAP.map.getZoom(),16));
    refreshAll();return p;
  }catch(e){toast(e.message);return null;}
}
function showOnMap(id){
  const m=getM(id);if(!m||!hasLoc(m)||!MAP.map)return;

/* ---------------- location picker (mini map + search + GPS + paste) ---------------- */
function LocPicker(host,init,onPick){
  host.innerHTML='<div class="lp"><select class="in" data-lp="base" aria-label="地図の種類" style="min-height:40px;padding:6px 10px;font-size:14px">'+BASES.map((b,i)=>'<option value="'+i+'"'+(i===state.baseIdx?' selected':'')+'>'+esc(b.name)+'</option>').join('')+'</select><div class="lp-map" data-lp="map"></div><div class="lp-search"><input class="in" type="search" data-lp="q" placeholder="住所・駅名・施設名で検索" autocomplete="off"><button class="btn sm primary" type="button" data-lp="go">検索</button></div><div class="lp-results" data-lp="res"></div><div class="rowbtns"><button class="btn sm" type="button" data-lp="gps">'+I.target+'現在地を使う</button><button class="btn sm ghost" type="button" data-lp="pastebtn">座標・URLを貼り付け</button></div><div data-lp="paste" hidden class="lp"><textarea class="in" data-lp="pastein" rows="2" placeholder="35.6812, 139.7671"></textarea><div class="rowbtns"><button class="btn sm primary" type="button" data-lp="apply">この座標にする</button><a class="btn sm" target="_blank" rel="noopener" href="https://www.google.com/maps">'+I.ext+'Googleマップを開く</a></div></div><p class="msg" data-lp="msg" aria-live="polite">地図をタップするか、ピンをドラッグして位置を決めます。</p></div>';
  const q=s=>host.querySelector('[data-lp="'+s+'"]');
  const say=(t,c)=>{const m=q('msg');m.className='msg'+(c?' '+c:'');m.textContent=t;};
  let map=null,marker=null;
  function setPoint(lat,lng,src,pan){
    if(map){
      if(!marker){marker=L.marker([lat,lng],{icon:pinIcon(true),draggable:true,keyboard:false}).addTo(map);marker.on('dragend',()=>{const p=marker.getLatLng();setPoint(p.lat,p.lng,'map',false);});}
      else marker.setLatLng([lat,lng]);
      if(pan)map.setView([lat,lng],Math.max(map.getZoom(),17));
    }
    say(coordTxt(lat,lng)+' に設定しました。','ok');
    onPick(lat,lng,src);
  }
  if(window.L){
    map=L.map(q('map'),{zoomControl:true,worldCopyJump:true,maxZoom:20});
    map.attributionControl.setPrefix(false);
    let baseL=null;
    const useBase=i=>{if(baseL)map.removeLayer(baseL);baseL=makeBase(i).addTo(map);baseL.bringToBack();q('map').classList.toggle('is-photo',!!BASES[i].photo);};
    useBase(state.baseIdx);
    q('base').onchange=e=>{const i=+e.target.value;useBase(i);if(MAP.map)setBase(i,false);else{state.baseIdx=i;ls.set('jm-base2',BASES[i].id);}};
    const c=init&&typeof init.lat==='number'?[[init.lat,init.lng],17]:state.me?[[state.me.lat,state.me.lng],16]:MAP.map?[MAP.map.getCenter(),Math.max(MAP.map.getZoom(),13)]:[[35.68,139.76],12];
    map.setView(c[0],c[1]);
    if(init&&typeof init.lat==='number'){setPoint(init.lat,init.lng,init.src||'',false);say(coordTxt(init.lat,init.lng)+'（ピンをドラッグして微調整できます）');}
    map.on('click',e=>setPoint(e.latlng.lat,e.latlng.lng,'map',false));
    setTimeout(()=>map&&map.invalidateSize(),80);
  }else{q('map').innerHTML='<div class="mapfail">地図を読み込めませんでした。座標の貼り付けで位置を設定できます。</div>';q('paste').hidden=false;}
  q('gps').onclick=async()=>{say('現在地を取得しています…');try{const p=await getPos();state.me=p;showMe();setPoint(p.lat,p.lng,'gps',true);}catch(e){say(e.message,'err');}};
  q('pastebtn').onclick=()=>{q('paste').hidden=!q('paste').hidden;};
  q('apply').onclick=()=>{const r=parseLoc(q('pastein').value);if(r.err){say(r.err,'err');return;}setPoint(r.lat,r.lng,'manual',true);};
  async function search(){
    const t=q('q').value.trim();if(!t)return;
    say('検索しています…');q('res').innerHTML='';
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=ja&q='+encodeURIComponent(t));
      const a=await r.json();
      if(!a.length){say('見つかりませんでした。別の言葉で試してください。','err');return;}
      say('候補から選んでください。');
      q('res').innerHTML=a.map((x,i)=>'<button type="button" data-lp="pick" data-i="'+i+'">'+esc(x.display_name)+'</button>').join('');
      q('res').onclick=e=>{const b=e.target.closest('[data-lp="pick"]');if(!b)return;const x=a[+b.dataset.i];q('res').innerHTML='';setPoint(+x.lat,+x.lon,'search',true);};
    }catch(e){say('検索できませんでした。通信状況を確認してください。','err');}
  }
  q('go').onclick=search;
  q('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search();}});
  return {destroy(){if(map){map.remove();map=null;}host.innerHTML='';}};
}

const BOXRULE='- box は、その飲料の見本（缶やボトル本体）だけをぴったり囲む四角を、画像全体の幅・高さをそれぞれ0〜1000とした整数 [上端y, 左端x, 下端y, 右端x] で書く。価格表示やボタンは含めない。\n';
const P_ALL='日本の自動販売機の正面写真です。写っている飲料の見本を、商品ごとに1件ずつ、左上から右下の順に読み取ってください。\nルール:\n- name は見本のラベルに書かれた商品名をそのまま書く。読めない商品は含めない。\n- price はボタン付近の表示が読み取れたときだけ数値(円)で書く。読めなければ null。\n- temp は、つめたい商品の表示(青)なら "cold"、あたたかい商品(赤)なら "hot"、分からなければ ""。\n- type は 缶 / ペット / 瓶 / 紙パック / カップ / その他 のいずれか。\n'+BOXRULE+'- 同じ商品が複数の列に並んでいるときは1件にまとめる。\n- 推測で商品を作らない。自動販売機でなければ drinks は空配列にする。\n次の形式のJSONだけを返してください: {"drinks":['+SCHEMA+']}';
const P_ONE='この画像には飲料が1つ、または自動販売機の一部が写っています。いちばん中心にある飲料を1つだけ読み取ってください。\nルール:\n- name はラベルに書かれた商品名をそのまま書く。読めなければ drink を null にする。\n- price は価格表示が見えるときだけ数値(円)、見えなければ null。\n- temp はつめたい表示(青)なら "cold"、あたたかい表示(赤)なら "hot"、分からなければ ""。\n- type は 缶 / ペット / 瓶 / 紙パック / カップ / その他 のいずれか。\n'+BOXRULE+'- 推測で商品を作らない。\n次の形式のJSONだけを返してください: {"drink":'+SCHEMA+'} または {"drink":null}';
const clean=s=>String(s||'').replace(/[\r\n「」"]/g,' ').trim().slice(0,80);
const P_LOC=d=>'この自動販売機の写真の中から、飲料「'+clean(d.name)+'」'+(d.maker?'（'+clean(d.maker)+'）':'')+'の見本を探してください。\n見つかったら、その見本（缶やボトル本体）だけをぴったり囲む四角を、画像全体の幅・高さをそれぞれ0〜1000とした整数 [上端y, 左端x, 下端y, 右端x] で返してください。見つからなければ found を false にします。\nJSONだけを返してください: {"found":true,"box":[0,0,0,0]}';
const P_LOOK=d=>'日本の自動販売機で売られている飲料を、インターネットで検索して照合してください。\n読み取った情報: 商品名「'+clean(d.name)+'」 / メーカー「'+(clean(d.maker)||'不明')+'」 / 容量「'+(clean(d.size)||'不明')+'」 / 容器「'+(d.type||'不明')+'」\n（画像が付いている場合は、その飲料の見本写真です。）\nルール:\n- メーカー公式サイトや商品ページなど信頼できる情報で、実在する商品と一致すると確認できたときだけ match を true にする。\n- name は公式の正式な商品名、maker は製造・販売しているメーカー名（会社名がわかるときは会社名）、size は主な容量、type は 缶 / ペット / 瓶 / 紙パック / カップ / その他。\n- 確認できない項目は空文字にする。推測で作らない。価格は答えない。\n- note に根拠を40字以内で書く。\n次の形式のJSONだけを返してください: {"match":true,"name":"","maker":"","type":"","size":"","note":""}';

function parseJSONText(text){
  const a=text.indexOf('{'),z=text.lastIndexOf('}');
  try{return JSON.parse(a>=0&&z>a?text.slice(a,z+1):text);}catch(e){throw {code:'invalid_json'};}
}
async function postAI({prompt,blob,signal,search}){
  const key=apiKey();
  if(!key)throw {code:'no_key'};
  const b64=blob?await blobToB64(blob):null,prov=provider();
  let res;
  try{
    if(prov==='gemini'){
      const parts=[];
      if(b64)parts.push({inline_data:{mime_type:'image/jpeg',data:b64}});
      parts.push({text:prompt});
      const body={contents:[{role:'user',parts}],generationConfig:{temperature:0.1,maxOutputTokens:8192}};
      if(search)body.tools=[{google_search:{}}];else body.generationConfig.responseMimeType='application/json';
      res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(apiModel())+':generateContent',{method:'POST',signal,
        headers:{'content-type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
    }else{
      const content=[];
      if(b64)content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}});
      content.push({type:'text',text:prompt});
      const body={model:apiModel(),max_tokens:4000,messages:[{role:'user',content}]};
      if(search)body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:3}];
      res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,
        headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
    }
  }catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:'network'};}
  if(!res.ok){
    let body='';try{body=await res.text();}catch(e){}
    const bad=/API key|API_KEY|permission|PERMISSION/i.test(body);
    let code=res.status===401||res.status===403||(res.status===400&&bad)?'auth':res.status===429?'rate_limited':res.status===404?'model_missing':res.status===400||res.status===413?'image_rejected':'upstream_error';
    if(search&&code==='image_rejected')code='search_failed';
    throw {code};
  }
  const data=await res.json();
  let text='';const refs=[];
  if(prov==='gemini'){
    const c=data.candidates&&data.candidates[0];
    const parts=(c&&c.content&&c.content.parts)||[];
    text=parts.map(x=>x.text||'').join('');
    const ch=(c&&c.groundingMetadata&&c.groundingMetadata.groundingChunks)||[];
    for(const g of ch)if(g.web&&g.web.uri)refs.push({title:g.web.title||'',uri:g.web.uri});
  }else{
    for(const b of (data.content||[])){
      if(b.type==='text')text+=b.text||'';
      else if(b.type==='web_search_tool_result'&&Array.isArray(b.content))for(const g of b.content)if(g&&g.url)refs.push({title:g.title||'',uri:g.url});
    }
  }
  if(!text)throw {code:'invalid_json'};
  return {text,refs};
}
async function callAI(prompt,blob,signal){const r=await postAI({prompt,blob,signal});return parseJSONText(r.text);}
function normBox(b){
  if(!Array.isArray(b)||b.length!==4)return null;
  const v=b.map(Number);if(v.some(x=>!isFinite(x)))return null;
  const [y0,x0,y1,x1]=v.map(x=>clamp(x,0,1000));
  if(y1-y0<30||x1-x0<30)return null;
  return [y0,x0,y1,x1];
}
function normDrink(x){
  if(!x||typeof x!=='object')return null;
  const name=String(x.name||'').trim();if(!name)return null;
  let type=String(x.type||'').replace('ペットボトル','ペット');if(!TYPES.includes(type))type='';
  let price=null;
  if(typeof x.price==='number'||/^\d+$/.test(String(x.price==null?'':x.price)))price=Math.round(Number(x.price));
  if(price!==null&&(!(price>0)||price>3000))price=null;
  return {id:newId('d'),name:name.slice(0,60),maker:String(x.maker||'').trim().slice(0,40),type,size:String(x.size||'').trim().slice(0,16),price,temp:x.temp==='hot'||x.temp==='cold'?x.temp:'',ai:true,photo:null,checked:false,box:normBox(x.box||x.box_2d)};
}
function normLook(r){
  if(!r||r.match!==true)return null;
  let type=String(r.type||'').replace('ペットボトル','ペット');if(!TYPES.includes(type))type='';
  const o={name:String(r.name||'').trim().slice(0,60),maker:String(r.maker||'').trim().slice(0,40),type,size:String(r.size||'').trim().slice(0,16),note:String(r.note||'').trim().slice(0,80)};
  return (o.name||o.maker)?o:null;
}
const dkey=d=>norm(d.name)+'|'+norm(d.maker);
const AI_ERR={rate_limited:'短い間に使いすぎました（無料枠の上限のことがあります）。少し待ってからもう一度お試しください。',image_rejected:'この画像は読み取れませんでした。別の写真か、別の範囲で試してください。',invalid_json:'うまく読み取れませんでした。もう一度試してください。',auth:'APIキーが正しくありません。設定で確認してください。',model_missing:'選んだモデルが使えません。設定で別のモデルに切り替えてください。',search_failed:'このモデルやキーでは、ネット照合が使えませんでした。設定で別のモデルを選ぶと使えることがあります。',network:'通信できませんでした。ネットワークを確認してもう一度お試しください。'};

const _bu=new WeakMap();
function blobURL(b){if(!b)return '';let u=_bu.get(b);if(!u){u=URL.createObjectURL(b);_bu.set(b,u);}return u;}
async function cropImg(img,box){
  const W=img.naturalWidth,H=img.naturalHeight,[y0,x0,y1,x1]=box;
  const bw=(x1-x0)/1000*W,bh=(y1-y0)/1000*H,pad=Math.max(bw,bh)*0.06;
  const sx=Math.max(0,x0/1000*W-pad),sy=Math.max(0,y0/1000*H-pad);
  const ex=Math.min(W,x1/1000*W+pad),ey=Math.min(H,y1/1000*H+pad);
  return imgBlob(img,360,.82,sx,sy,ex-sx,ey-sy);
}
async function cropBlobFrom(src,box){
  const u=URL.createObjectURL(src);
  try{return await cropImg(await loadImg(u),box);}finally{URL.revokeObjectURL(u);}
}
async function shrinkBlob(src,max){
  const u=URL.createObjectURL(src);
  try{const img=await loadImg(u);return await imgBlob(img,max,.82);}finally{URL.revokeObjectURL(u);}
}

const drinkImg=d=>d.photo?'<img src="'+esc(blobURL(d.photo))+'" alt="">':PH_SVG;

function DrinksEditor(host,ctx){

  const drinks=()=>ctx.getDrinks();
  const getD=id=>drinks().find(x=>x.id===id);
  const spinHTML=msg=>'<span class="spin"></span><span style="flex:1">'+esc(msg)+'</span><button class="btn sm ghost" type="button" data-a="cancel">中止</button>';
  function drawBar(){
    if(!ctx.hasPhoto()){R('bar').innerHTML='';return;}

  }
  function setStatus(h){statusHTML=h;const s=R('status');s.hidden=!statusHTML;s.innerHTML=statusHTML;}
  function drawGrid(){
    R('grid').innerHTML=drinks().map(d=>'<button type="button" class="slot'+(d.id===selId?' sel':'')+'" data-a="pick" data-id="'+d.id+'"><span class="slot-img">'+drinkImg(d)+'</span><span class="slot-top"><i class="td td-'+(d.temp||'n')+'"></i><span>'+esc(d.type||'')+'</span>'+(d.ai?'<span class="ai-tag">AI</span>':'')+(d.checked?'<span class="ai-tag ok" title="ネット照合済み">✓</span>':'')+'</span><span class="slot-name">'+esc(d.name||'名称未入力')+'</span><span class="slot-maker">'+esc(d.maker||'')+'</span><span class="led">'+priceTxt(d.price)+'</span></button>').join('')+'<button type="button" class="slot add" data-a="add">'+I.plus+'手入力で追加</button>';
  }
  function drawLk(){
    const el=R('ed').querySelector('[data-r="lk"]'),d=getD(selId);
    if(!el||!d)return;
    const L=look[d.id],key=!!apiKey();
    let h='';
    if(key&&String(d.name||'').trim())h+='<button class="btn" type="button" data-a="look"'+(busy?' disabled':'')+'>'+I.globe+'ネットで照合（製造元・正式名）</button>';
    else if(!key)h+='<p class="note">ネット照合には、設定でAPIキーが必要です。</p>';
    if(L&&L.o){
      const rows=[['name','商品名'],['maker','メーカー'],['type','容器'],['size','容量']].filter(([k])=>L.o[k]&&L.o[k]!==(d[k]||''));
      h+='<div class="lookbox"><strong>ネットの照合結果</strong>'+(rows.length?'<ul>'+rows.map(([k,t])=>'<li><span>'+t+'</span> '+(d[k]?'<s>'+esc(d[k])+'</s> → ':'')+'<b>'+esc(L.o[k])+'</b></li>').join('')+'</ul>':'<p class="note">読み取った内容と一致しています。</p>')+(L.o.note?'<p class="note">'+esc(L.o.note)+'</p>':'')+'<div class="rowbtns"><button class="btn sm primary" type="button" data-a="look-apply">反映する</button><button class="btn sm ghost" type="button" data-a="look-skip">使わない</button></div></div>';
    }else if(L&&L.none)h+='<p class="note">ネット上で確かな一致は見つかりませんでした。名前を直してからもう一度試すか、そのまま使えます。</p>';
    if(d.checked){
      const refs=(d.refs||[]).filter(r=>/^https?:\/\//i.test(r.uri||'')).slice(0,3);
      h+='<div class="tags"><span class="tag ok">'+I.check+'ネット照合済み</span></div>'+(refs.length?'<div class="refs">'+refs.map(r=>'<a target="_blank" rel="noopener noreferrer" href="'+esc(r.uri)+'">'+esc(r.title||'参照ページ')+'</a>').join('')+'</div>':'')+(d.orig?'<button class="btn sm ghost" type="button" data-a="look-undo">読み取り時の内容に戻す</button>':'');
    }
    el.innerHTML=h;
  }
  function drawEd(){
    const d=getD(selId);
    if(!d){R('ed').innerHTML='';return;}
    const canCrop=ctx.hasPhoto();
    R('ed').innerHTML='<div class="ed" data-id="'+d.id+'"><div class="ed-h"><strong>商品を編集</strong><button class="btn sm ghost" type="button" data-a="close-ed">閉じる</button></div>'
    +'<div class="ed-photo"><div class="dphoto">'+drinkImg(d)+'</div><div class="ed-pbtns">'
    +(canCrop?'<button class="btn sm" type="button" data-a="recrop">'+I.crop+'写真から切り抜く</button>':'')
    +(canCrop&&apiKey()?'<button class="btn sm" type="button" data-a="aicrop"'+(busy?' disabled':'')+'>'+I.spark+'AIで切り抜く</button>':'')
    +'<button class="btn sm" type="button" data-a="dshot">'+I.camera+'撮影・選択</button>'
    +(d.photo?'<button class="btn sm ghost" type="button" data-a="dphoto-del">写真を消す</button>':'')+'</div></div>'
    +'<div data-r="lk" class="lk"></div>'
    +'<label class="fld">商品名<input class="in" data-f="name" value="'+esc(d.name)+'" maxlength="60"></label><label class="fld">メーカー・ブランド<input class="in" data-f="maker" value="'+esc(d.maker||'')+'" maxlength="40"></label><div class="g2"><label class="fld">容器<select class="in" data-f="type"><option value="">未選択</option>'+TYPES.map(t=>'<option'+(d.type===t?' selected':'')+'>'+t+'</option>').join('')+'</select></label><label class="fld">容量<input class="in" data-f="size" value="'+esc(d.size||'')+'" placeholder="350ml" maxlength="16"></label></div><div class="g2"><label class="fld">価格（円）<input class="in" data-f="price" inputmode="numeric" value="'+(typeof d.price==='number'?d.price:'')+'" placeholder="130"></label><label class="fld">温度<select class="in" data-f="temp"><option value="">指定なし</option><option value="cold"'+(d.temp==='cold'?' selected':'')+'>つめたい</option><option value="hot"'+(d.temp==='hot'?' selected':'')+'>あたたかい</option></select></label></div><button class="btn danger" type="button" data-a="del">この商品を削除</button></div>';
    drawLk();
  }
  function drawAll(){drawBar();R('status').hidden=!statusHTML;drawGrid();drawEd();}
  function addDrinks(list,selectFirst){
    const cur=drinks(),byKey=new Map(cur.map(d=>[dkey(d),d]));let added=0,first=null,filled=0;
    for(const n of list){
      const ex=byKey.get(dkey(n));
      if(ex){if(!ex.photo&&n.photo){ex.photo=n.photo;filled++;}continue;}
      byKey.set(dkey(n),n);cur.push(n);added++;if(!first)first=n;
    }
    if(added||filled){ctx.onChange();if(selectFirst&&first)selId=first.id;}
    drawGrid();drawEd();
    return {added,filled};
  }
  async function withBusy(msg,fn){
    if(busy)return;
    const ctl=new AbortController();busy=ctl;drawBar();
    setStatus(spinHTML(msg));
    try{await fn(ctl.signal);}
    catch(e){const code=e&&e.code;setStatus(code==='cancelled'?'中止しました。':esc(AI_ERR[code]||'うまくいきませんでした。もう一度お試しください。'));}
    finally{busy=null;drawBar();drawGrid();drawEd();}
  }
  function readOne(blob,kind){
    return withBusy('AIが写真を読み取っています。数十秒かかることがあります。',async signal=>{
      const r=await callAI(kind==='all'?P_ALL:P_ONE,blob,signal);
      let list=[];
      if(kind==='all'){const arr=Array.isArray(r)?r:(r&&r.drinks);list=(Array.isArray(arr)?arr:[]).slice(0,40).map(normDrink).filter(Boolean);}
      else{const one=r&&!Array.isArray(r)?(r.drink!==undefined?r.drink:r):(Array.isArray(r)?r[0]:null);const n=normDrink(one);if(n)list=[n];}
      if(!list.length){setStatus(kind==='all'?'商品を読み取れませんでした。写真全体が写っているか確認するか、範囲を選んで1本ずつ試してください。':'商品を判別できませんでした。範囲を変えるか、手入力で追加してください。');return;}
      setStatus(spinHTML('飲料ごとの写真を切り抜いています…'));
      const u=URL.createObjectURL(blob);
      let img=null;try{img=await loadImg(u);}catch(e){}
      for(const n of list){
        try{if(img&&n.box)n.photo=await cropImg(img,n.box);else if(kind==='one')n.photo=await shrinkBlob(blob,360);}catch(e){}
        delete n.box;
      }
      URL.revokeObjectURL(u);
      const k=list.filter(n=>n.photo).length;
      const res=addDrinks(list,kind==='one');
      setStatus(res.added||res.filled?(res.added+'件を追加しました'+(k?'（写真'+k+'枚）':'')+'。内容を確認してください。'):'すでに登録済みの商品でした。');
    });
  }
  function locateOne(id){
    const d=getD(id),blob=ctx.getBlob();if(!d||!blob)return;
    return withBusy('AIが写真から「'+(d.name||'この飲料')+'」を探しています…',async signal=>{
      const r=await callAI(P_LOC(d),blob,signal);
      const box=r&&r.found!==false?normBox(r.box):null;
      if(!box){setStatus('写真の中で見つかりませんでした。「写真から切り抜く」で手動で選んでください。');return;}
      d.photo=await cropBlobFrom(blob,box);ctx.onChange();
      setStatus('切り抜きました。ずれているときは「写真から切り抜く」で直せます。');
    });
  }
  function applyLook(d,o,refs){
    if(!d.orig)d.orig={name:d.name,maker:d.maker||'',type:d.type||'',size:d.size||''};
    for(const k of ['name','maker','type','size'])if(o[k])d[k]=o[k];
    d.checked=true;d.refs=(refs||[]).slice(0,3);
  }
  async function lookupCall(d,signal){
    const r=await postAI({prompt:P_LOOK(d),blob:d.photo||null,signal,search:true});
    return {o:normLook(parseJSONText(r.text)),refs:r.refs};
  }
  function lookOne(id){
    const d=getD(id);if(!d)return;
    return withBusy('「'+d.name+'」をネットで照合しています…',async signal=>{
      const {o,refs}=await lookupCall(d,signal);
      if(!o){look[id]={none:true};setStatus('ネット上で確かな一致は見つかりませんでした。');}
      else{look[id]={o,refs};setStatus('照合結果が見つかりました。内容を確認して反映してください。');}
    });
  }
  function lookAll(){
    return withBusy('ネットで照合しています…',async signal=>{
      const todo=drinks().filter(d=>!d.checked&&String(d.name||'').trim());
      let ok=0,miss=0,stop='';
      for(let i=0;i<todo.length;i++){
        if(signal.aborted){stop='cancelled';break;}
        const d=todo[i];
        setStatus(spinHTML('ネットで照合しています… '+(i+1)+' / '+todo.length));
        try{
          const {o,refs}=await lookupCall(d,signal);
          if(o){applyLook(d,o,refs);ok++;ctx.onChange();drawGrid();}else miss++;
        }catch(e){
          const c=e&&e.code;
          if(c==='cancelled'||c==='auth'||c==='rate_limited'||c==='search_failed'||c==='network'||c==='model_missing'){stop=c;break;}
          miss++;
        }
        await new Promise(r=>{const t=setTimeout(r,1100);signal.addEventListener('abort',()=>{clearTimeout(t);r();},{once:true});});
      }
      setStatus(ok+'件を照合して反映しました'+(miss?'（一致なし '+miss+'件）':'')+'。'+(stop&&stop!=='cancelled'?esc(AI_ERR[stop]||'')+' 続きはもう一度押してください。':stop==='cancelled'?'途中で中止しました。':''));
    });
  }
  root.addEventListener('click',async e=>{
    const b=e.target.closest('[data-a]');if(!b||!root.contains(b))return;
    const a=b.dataset.a;
    if(a==='pick'){selId=selId===b.dataset.id?null:b.dataset.id;drawGrid();drawEd();if(selId)R('ed').scrollIntoView({block:'nearest',behavior:'smooth'});}
    else if(a==='add'){const d={id:newId('d'),name:'',maker:'',type:'',size:'',price:null,temp:'',ai:false,photo:null,checked:false};drinks().push(d);selId=d.id;ctx.onChange();drawGrid();drawEd();const f=R('ed').querySelector('[data-f="name"]');if(f)f.focus();}
    else if(a==='close-ed'){selId=null;drawGrid();drawEd();}
    else if(a==='del'){const i=drinks().findIndex(x=>x.id===selId);if(i>=0){drinks().splice(i,1);ctx.onChange();}selId=null;drawGrid();drawEd();}
    else if(a==='cancel'){if(busy)busy.abort();}
    else if(a==='setup')openSettings();
    else if(a==='all'){const blob=ctx.getBlob();if(blob)readOne(blob,'all');else setStatus('写真を読み込めませんでした。');}
    else if(a==='crop'){const url=ctx.getUrl();if(url)openCropper(url,blob=>readOne(blob,'one'));}
    else if(a==='photo'){R('file').value='';R('file').click();}
    else if(a==='recrop'){
      const id=selId,url=ctx.getUrl();if(!url)return;
      openCropper(url,async blob=>{const d=getD(id);if(!d)return;try{d.photo=await shrinkBlob(blob,360);ctx.onChange();drawGrid();drawEd();}catch(err){toast('写真を切り抜けませんでした。');}},{title:'この飲料だけを指でなぞる',ok:'この範囲で決定',all:'写真全体'});
    }
    else if(a==='aicrop')locateOne(selId);
    else if(a==='dshot'){R('dfile').value='';R('dfile').click();}
    else if(a==='dphoto-del'){const d=getD(selId);if(d){d.photo=null;ctx.onChange();drawGrid();drawEd();}}
    else if(a==='look')lookOne(selId);
    else if(a==='look-all')lookAll();
    else if(a==='look-apply'){const d=getD(selId),L=look[selId];if(d&&L&&L.o){applyLook(d,L.o,L.refs);delete look[selId];ctx.onChange();setStatus('反映しました。');drawGrid();drawEd();}}
    else if(a==='look-skip'){delete look[selId];drawLk();}
    else if(a==='look-undo'){const d=getD(selId);if(d&&d.orig){Object.assign(d,d.orig);d.checked=false;d.refs=[];delete d.orig;ctx.onChange();drawGrid();drawEd();}}
  });
  root.addEventListener('input',e=>{
    const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
    const ed=e.target.closest('.ed');const d=getD(ed&&ed.dataset.id);if(!d)return;
    if(f==='price'){const n=parseInt(String(e.target.value).replace(/[^\d]/g,''),10);d.price=isFinite(n)&&n>0?n:null;}
    else{
      d[f]=e.target.value;
      if((f==='name'||f==='maker')&&d.checked){d.checked=false;drawLk();}
    }
    ctx.onChange();drawGrid();
  });
  root.addEventListener('change',async e=>{
    const t=e.target,file=t.files&&t.files[0];
    if(!file)return;
    if(t===R('file')){
      try{const url=URL.createObjectURL(file);const img=await loadImg(url);const blob=await imgBlob(img,1280,.88);URL.revokeObjectURL(url);readOne(blob,'one');}
      catch(err){setStatus('この写真は読み込めませんでした。JPEGかPNGでお試しください。');}
    }else if(t===R('dfile')){
      const id=selId;
      try{const d=getD(id);if(!d)return;d.photo=await shrinkBlob(file,360);ctx.onChange();drawGrid();drawEd();}
      catch(err){toast('この写真は読み込めませんでした。');}
    }
  });
  drawAll();
  return {destroy(){if(busy)busy.abort();}};
}

function openCropper(url,onDone,opts){
  opts=opts||{};
  const el=document.createElement('div');el.className='cropper';
  el.innerHTML='<div class="cr-top"><button class="btn sm" type="button" data-c="x">キャンセル</button><span>'+esc(opts.title||'読み取る商品を指でなぞる')+'</span><span style="width:84px"></span></div><div class="cr-stage"><div class="cr-wrap"><img alt="元の写真"><div class="cr-box" hidden></div></div></div><p class="cr-help">商品の見本だけが入るように四角で囲みます。</p><div class="cr-bottom"><button class="btn" type="button" data-c="all">'+esc(opts.all||'写真全体')+'</button><button class="btn primary" type="button" data-c="ok" disabled>'+esc(opts.ok||'この範囲を読み取る')+'</button></div>';
  document.body.appendChild(el);
  const img=$('img',el),box=$('.cr-box',el),wrap=$('.cr-wrap',el),ok=$('[data-c="ok"]',el);
  let sel=null,start=null;
  img.src=url;
  const close=()=>el.remove();
  const pt=e=>{const r=img.getBoundingClientRect();return {x:clamp(e.clientX-r.left,0,r.width),y:clamp(e.clientY-r.top,0,r.height)};};
  function paint(){
    if(!sel||sel.w<2){box.hidden=true;ok.disabled=true;return;}
    box.hidden=false;box.style.left=sel.x+'px';box.style.top=sel.y+'px';box.style.width=sel.w+'px';box.style.height=sel.h+'px';
    ok.disabled=!(sel.w>=24&&sel.h>=24);
  }
  wrap.addEventListener('pointerdown',e=>{e.preventDefault();wrap.setPointerCapture(e.pointerId);start=pt(e);sel={x:start.x,y:start.y,w:0,h:0};paint();});
  wrap.addEventListener('pointermove',e=>{if(!start)return;const p=pt(e);sel={x:Math.min(start.x,p.x),y:Math.min(start.y,p.y),w:Math.abs(p.x-start.x),h:Math.abs(p.y-start.y)};paint();});
  const end=()=>{start=null;};
  wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);
  el.addEventListener('click',async e=>{
    const b=e.target.closest('[data-c]');if(!b)return;
    const c=b.dataset.c;
    if(c==='x'){close();return;}
    try{
      if(c==='all'){const blob=await imgBlob(img,1600,.9);close();onDone(blob);return;}
      if(c==='ok'&&sel){
        const k=img.naturalWidth/img.clientWidth;
        let sx=sel.x*k,sy=sel.y*k,sw=sel.w*k,sh=sel.h*k;
        const pad=Math.max(sw,sh)*0.06;
        sx=Math.max(0,sx-pad);sy=Math.max(0,sy-pad);
        sw=Math.min(img.naturalWidth-sx,sw+pad*2);sh=Math.min(img.naturalHeight-sy,sh+pad*2);
        const blob=await imgBlob(img,1280,.9,sx,sy,sw,sh);close();onDone(blob);
      }
    }catch(err){toast('写真を切り出せませんでした。');close();}
  });
}

async function setPhoto(file){
  const d=draft;if(!d||!file)return;
  d.loading=true;d.error='';renderStep();
  try{
    const ex=parseExif(await file.slice(0,262144).arrayBuffer());
    const url=URL.createObjectURL(file),img=await loadImg(url);
    const big=await imgBlob(img,1600,.82),thumb=await imgBlob(img,420,.72);
    URL.revokeObjectURL(url);
    if(draft!==d)return;
    if(d.previewUrl)URL.revokeObjectURL(d.previewUrl);
    d.previewUrl=URL.createObjectURL(big);d.img=img;d.big=big;d.thumb=thumb;
    d.shotAt=ex.shotAt||null;
    if(typeof ex.lat==='number'){d.lat=ex.lat;d.lng=ex.lng;d.locSource='exif';}else{d.lat=null;d.lng=null;d.locSource='';}
  }catch(e){d.error='この写真は読み込めませんでした。JPEGかPNGの写真でお試しください。';}
  d.loading=false;if(draft===d)renderStep();
}
async function saveDraft(){

      drinks:d.drinks.filter(x=>String(x.name||'').trim()).map(x=>({id:x.id,name:String(x.name).trim(),maker:String(x.maker||'').trim(),type:x.type||'',size:String(x.size||'').trim(),price:typeof x.price==='number'?x.price:null,temp:x.temp||'',ai:!!x.ai,photo:x.photo||null,checked:!!x.checked,refs:x.refs||[],orig:x.orig||null}))};
    await insertMachine(m);
    closeRegister();refreshAll();toast('登録しました。');
    if(hasLoc(m)){state.fitted=true;showOnMap(m.id);}else setTab('list');
  }catch(e){
    d.busy=false;d.error='保存できませんでした。ブラウザの保存容量を確認して、もう一度お試しください。';
    if(draft===d)renderStep();
  }
}

/* ---------------- settings / backup ---------------- */
function openSettings(){
  const el=$('#sheet-set');el.hidden=false;document.body.classList.add('lock');
  el.innerHTML='<div class="sheet-in"><div class="sh-top"><button class="icon-btn" type="button" data-act="set-close" aria-label="戻る">'+I.back+'</button><h2>設定とバックアップ</h2></div><div class="sh-body">'
  +'<div class="panel"><h3>AIで飲料を読み取る</h3><p class="note">写真から飲料の名前・価格を読み取ります。キーはこのブラウザにだけ保存され、読み取りのときにAIの会社へ直接送られます。自分専用の端末で使ってください。</p><label class="fld">使うAI<select class="in" id="set-prov">'+Object.keys(PROVIDERS).map(k=>'<option value="'+k+'"'+(provider()===k?' selected':'')+'>'+PROVIDERS[k].name+'</option>').join('')+'</select></label><label class="fld">APIキー<input class="in" id="set-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label><label class="fld">モデル<select class="in" id="set-model"></select></label><div class="rowbtns"><button class="btn sm primary" type="button" data-act="set-save">保存</button><a class="btn sm" id="set-keylink" target="_blank" rel="noopener" href="#">'+I.ext+'キーを発行する</a><button class="btn sm ghost" type="button" data-act="set-clearkey">キーを消す</button></div><p class="note" id="set-free"></p><p class="msg" id="set-msg" aria-live="polite"></p></div>'
  +'<div class="panel"><h3>データのバックアップ</h3><p class="note">登録データ（写真を含む）はこのブラウザの中にだけあります。機種変更や別の端末へ移すときは、書き出したファイルを読み込みます。</p><div class="rowbtns"><button class="btn sm primary" type="button" data-act="set-export">書き出す</button><label class="btn sm" style="cursor:pointer">読み込む<input type="file" accept="application/json,.json" id="set-import" hidden></label></div><p class="msg" id="set-msg2" aria-live="polite"></p></div>'
  +'<div class="panel"><h3>地図の出典</h3><p class="note">地図: 地理院タイル（国土地理院）、&copy; OpenStreetMap contributors。住所検索: Nominatim（OpenStreetMap）。</p></div>'
  +'</div></div>';
  fillProv($('#set-prov').value,true);
  $('#set-prov').onchange=e=>fillProv(e.target.value,false);
}
function fillProv(p,initial){
  const P=PROVIDERS[p],cur=provider()===p;
  $('#set-key').value=(ls.get('jm-key-'+p)||(p==='claude'?ls.get('jm-key'):'')||'');
  $('#set-key').placeholder=P.ph;
  $('#set-model').innerHTML=P.models.map(([v,t])=>'<option value="'+v+'"'+((ls.get('jm-model-'+p)||P.models[0][0])===v?' selected':'')+'>'+t+'</option>').join('');
  $('#set-keylink').href=P.keyUrl;
  $('#set-free').textContent=p==='gemini'?'Googleアカウントがあれば、AI Studio で無料のキーを発行できます（クレジットカード不要）。無料枠では回数の上限があり、入力した写真がGoogleのサービス改善に使われることがあります。人の顔が写った写真は使わないでください。ネット照合はGoogle検索を使うため、1日あたりの回数上限が小さめです。':'Claudeは従量課金です。クレジットの登録が必要です。';
}
function closeSettings(){const s=$('#sheet-set');s.hidden=true;s.innerHTML='';if($('#sheet-reg').hidden&&$('#sheet-det').hidden)document.body.classList.remove('lock');}
async function exportAll(){
  const msg=$('#set-msg2');msg.className='msg';msg.textContent='書き出しています…';
  try{
    const out=[];
    for(const m of state.machines){
      const o=rec(m);delete o.photoBlob;delete o.thumbBlob;
      o.photo=m.photoBlob?await blobToDataURL(m.photoBlob):null;o.thumb=m.thumbBlob?await blobToDataURL(m.thumbBlob):null;
      o.drinks=[];
      for(const d of (m.drinks||[])){const c=Object.assign({},d);c.photo=d.photo?await blobToDataURL(d.photo):null;o.drinks.push(c);}
      out.push(o);
    }
    const blob=new Blob([JSON.stringify({app:'jihanki-map',version:1,exportedAt:Date.now(),machines:out})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    const t=new Date();a.download='jihanki-map-'+t.getFullYear()+String(t.getMonth()+1).padStart(2,'0')+String(t.getDate()).padStart(2,'0')+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    msg.className='msg ok';msg.textContent=out.length+'台を書き出しました。';
  }catch(e){msg.className='msg err';msg.textContent='書き出せませんでした。';}
}
async function importAll(file){
  const msg=$('#set-msg2');msg.className='msg';msg.textContent='読み込んでいます…';
  try{
    const j=JSON.parse(await file.text());
    if(!j||j.app!=='jihanki-map'||!Array.isArray(j.machines))throw new Error('format');
    let n=0;
    for(const o of j.machines){
      if(!o||!o.id)continue;
      const m=Object.assign({},o);
      m.photoBlob=o.photo?await (await fetch(o.photo)).blob():null;
      m.thumbBlob=o.thumb?await (await fetch(o.thumb)).blob():null;
      delete m.photo;delete m.thumb;
      m.drinks=[];
      for(const d of (Array.isArray(o.drinks)?o.drinks:[])){const c=Object.assign({},d);c.photo=d.photo&&typeof d.photo==='string'?await (await fetch(d.photo)).blob():null;m.drinks.push(c);}
      if(state.persist)await idbPut(m);
      const old=getM(m.id);
      if(old){[old._thumb,old._photo].forEach(u=>{if(u)URL.revokeObjectURL(u);});state.machines=state.machines.filter(x=>x.id!==m.id);}
      state.machines.push(hydrate(m));n++;
    }
    refreshAll();msg.className='msg ok';msg.textContent=n+'台を読み込みました。';
  }catch(e){msg.className='msg err';msg.textContent='読み込めませんでした。このアプリで書き出したファイルを選んでください。';}
}

/* ---------------- events ---------------- */
let qT;
function onQuery(v){state.f.q=v;clearTimeout(qT);qT=setTimeout(()=>{syncQueryInputs();refreshAll();},120);}
function syncQueryInputs(){if($('#q1').value!==state.f.q)$('#q1').value=state.f.q;if($('#q2').value!==state.f.q)$('#q2').value=state.f.q;}
function bind(){
  $('#q1').addEventListener('input',e=>onQuery(e.target.value));
  $('#q2').addEventListener('input',e=>onQuery(e.target.value));
  $('#to-list').onclick=()=>setTab('list');
  $('#f-max').onchange=e=>{state.f.max=+e.target.value;refreshAll();};
  $('#f-sort').onchange=async e=>{state.f.sort=e.target.value;if(state.f.sort==='near'&&!state.me){await locateMe(false);if(!state.me){state.f.sort='new';syncFilters();}}refreshAll();};
  document.addEventListener('click',e=>{
    const ft=e.target.closest('[data-ftype]');
    if(ft){state.f.type=ft.dataset.ftype;syncFilters();refreshAll();return;}
    const fm=e.target.closest('[data-ftemp]');
    if(fm){state.f.temp=fm.dataset.ftemp;syncFilters();refreshAll();return;}
    if(e.target.closest('[data-floc]')){state.f.located=!state.f.located;syncFilters();refreshAll();return;}
    const tb=e.target.closest('[data-tab]');
    if(tb){setTab(tb.dataset.tab);return;}
    const bo=e.target.closest('[data-base]');
    if(bo){setBase(+bo.dataset.base,false);hideBasePop();return;}
    const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act;
    if(a==='reg-open')openRegister();
    else if(a==='open')openDetail(b.dataset.id);
    else if(a==='clear-filter'){state.f={q:'',type:'',temp:'',max:0,sort:state.f.sort,located:false};syncFilters();refreshAll();}
    else if(a==='reg-close'){if(draft&&(draft.previewUrl||draft.drinks.length||draft.placeNote)){draft.confirm=true;paintConfirm();}else closeRegister();}
    else if(a==='reg-keep'){draft.confirm=false;paintConfirm();}
    else if(a==='reg-discard')closeRegister();
    else if(a==='reg-back'){if(draft.step>0){draft.step--;renderReg();}}
    else if(a==='reg-next'){if(draft.step<3){draft.step++;renderReg();}else saveDraft();}
    else if(a==='det-close')closeDetail();
    else if(a==='det-onmap')showOnMap(state.openId);
    else if(a==='det-locedit')toggleDetPicker();
    else if(a==='det-locclear'){const m=getM(state.openId);if(m){m.lat=null;m.lng=null;m.locSource='';touch(m.id);if(detLP){detLP.destroy();detLP=null;$('#det-lp').hidden=true;}detLoc();refreshAll();}}
    else if(a==='det-del'){
      if(b.classList.contains('sure'))deleteMachine(state.openId);
      else{b.classList.add('sure');b.textContent='本当に削除する（元に戻せません）';setTimeout(()=>{if(b.isConnected){b.classList.remove('sure');b.textContent='削除する';}},5000);}
    }
    else if(a==='set-open')openSettings();
    else if(a==='set-close')closeSettings();
    else if(a==='set-save'){const p=$('#set-prov').value,k=$('#set-key').value.trim();ls.set('jm-provider',p);if(k)ls.set('jm-key-'+p,k);ls.set('jm-model-'+p,$('#set-model').value);const m=$('#set-msg');m.className='msg ok';m.textContent=k?'保存しました。':'保存しました（キーは未入力です）。';}
    else if(a==='set-clearkey'){const p=$('#set-prov').value;ls.del('jm-key-'+p);if(p==='claude')ls.del('jm-key');$('#set-key').value='';const m=$('#set-msg');m.className='msg ok';m.textContent='キーを消しました。';}
    else if(a==='set-export')exportAll();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches&&e.target.matches('.card[data-act="open"]'))openDetail(e.target.dataset.id);
    if(e.key==='Escape'){
      const cr=$('.cropper');
      if(cr){cr.remove();return;}
      if(!$('#sheet-set').hidden){closeSettings();return;}
      if(!$('#sheet-reg').hidden&&draft){draft.confirm=true;paintConfirm();return;}
      if(!$('#sheet-det').hidden)closeDetail();
    }
  });
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='note-in'&&draft)draft.placeNote=t.value;
    else if(t.id==='memo-in'&&draft)draft.memo=t.value;
    else if(t.id==='det-note'){const m=getM(state.openId);if(m){m.placeNote=t.value;touch(m.id);const h=$('#sheet-det h2');if(h)h.textContent=t.value||'自販機の詳細';}}
    else if(t.id==='det-memo'){const m=getM(state.openId);if(m){m.memo=t.value;touch(m.id);}}
  });
  document.addEventListener('change',e=>{
    const t=e.target;
    if((t.id==='f-cam'||t.id==='f-lib')&&t.files&&t.files[0]){const f=t.files[0];t.value='';setPhoto(f);}
    else if(t.id==='set-import'&&t.files&&t.files[0]){const f=t.files[0];t.value='';importAll(f);}
  });
}

/* ---------------- boot ---------------- */
async function boot(){
  syncFilters();bind();mapInit();setTab('map');refreshAll();
  try{idb=await idbOpen();}catch(e){state.persist=false;}
  if(state.persist){try{state.machines=(await idbAll()).map(hydrate);}catch(e){state.persist=false;}}
  state.loaded=true;
  if(state.machines.some(hasLoc)&&!state.fitted){state.fitted=true;fitAll(false);}
  refreshAll();
  if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist();}catch(e){}}
}
boot();
})();
</script>
